global:
  scrape_interval: 5s

scrape_configs:
  - job_name: "streamguard-api"
    metrics_path: /metrics
    static_configs:
      - targets: ["host.docker.internal:3000"]

  - job_name: "streamguard-worker"
    metrics_path: /metrics
    static_configs:
      - targets: ["host.docker.internal:3001"]
